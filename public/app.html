<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Second Brain — Safe App</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#0b1220;color:#edf4ff}.wrap{max-width:1100px;margin:auto;padding:18px}.top{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}.pill{color:#9be7b2;font-size:13px}.grid{display:grid;grid-template-columns:minmax(280px,380px) 1fr;gap:16px}@media(max-width:800px){.grid{grid-template-columns:1fr}}.card{border:1px solid #263655;border-radius:14px;background:#101a2e;padding:16px}input,textarea,button{font:inherit;border-radius:9px;padding:10px}input,textarea{width:100%;border:1px solid #3a4d74;background:#0a1120;color:#fff}textarea{min-height:90px}button{border:0;background:#2864d7;color:#fff;font-weight:700;cursor:pointer}button.secondary{background:#263655}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.notes{display:grid;gap:10px;max-height:65vh;overflow:auto}.note{border:1px solid #263655;border-radius:10px;padding:10px;background:#0d1729}.note b{display:block;margin-bottom:6px}.muted{color:#9aaccc}.msg{min-height:22px;color:#ffcc99}.ok{color:#9be7b2}.answer{white-space:pre-wrap;line-height:1.5;border:1px solid #263655;border-radius:10px;background:#0d1729;padding:12px;min-height:120px}.file-label{display:inline-block;padding:8px 12px;background:#1e2d4a;border:1px dashed #3a4d74;border-radius:8px;cursor:pointer;font-size:13px;color:#9be7b2;text-align:center;width:100%}.attach{margin-top:8px;display:flex;flex-wrap:wrap;gap:8px}.attach a{color:#9dc5ff;font-size:13px;text-decoration:none;border:1px solid #3a4d74;border-radius:6px;padding:4px 8px;background:#12203a}.attach img{max-width:110px;max-height:110px;border-radius:6px;border:1px solid #3a4d74;display:block}</style></head><body><div class="wrap"><div class="top"><div><h1>Second Brain</h1><div class="pill">Safe mode — không dùng đồ thị/canvas</div></div><button class="secondary" id="reload">Tải lại ghi chú</button></div><div class="grid"><section class="card"><h2>Ghi chú</h2><div class="row"><input id="category" placeholder="Category"><input id="title" placeholder="Tiêu đề"></div><p><textarea id="content" placeholder="Nội dung ghi chú"></textarea></p><p><input id="tags" placeholder="tags, cách nhau bằng dấu phẩy"></p><p><label class="file-label" for="attachment">📎 Thêm file/ảnh đính kèm<input type="file" id="attachment" multiple accept="image/*,.pdf,.doc,.docx,.txt" style="display:none"></label></p><div id="attachmentPreview" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px"></div><div class="row"><button id="save">Lưu ghi chú</button><button class="secondary" id="clearForm">Xóa form</button></div><p id="noteMsg" class="msg"></p><h3>Danh sách</h3><div id="notes" class="notes"><div class="muted">Đang tải…</div></div></section><section class="card"><h2>Brain Query</h2><textarea id="question" placeholder="Hỏi Second Brain…"></textarea><p><button id="ask">Hỏi Brain</button></p><div id="brainMsg" class="msg"></div><div id="answer" class="answer muted">Câu trả lời sẽ hiện ở đây.</div></section></div></div><script>let notes=[];const $=id=>document.getElementById(id);const MAX_FILE=4*1024*1024;let pendingFiles=[];function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function fmtSize(b){b=Number(b)||0;if(b<1024)return b+' B';if(b<1048576)return (b/1024).toFixed(1)+' KB';return (b/1048576).toFixed(2)+' MB'}function render(){const box=$('notes');if(!notes.length){box.innerHTML='<div class="muted">Chưa có ghi chú.</div>';return}box.innerHTML=notes.map(n=>{const atts=Array.isArray(n.attachments)?n.attachments:[];const attHtml=atts.length?('<div class="attach">'+atts.map(a=>{const u=esc(a.url||'');const nm=esc(a.name||'file');const isImg=(a.type||'').startsWith('image/');return isImg?('<a href="'+u+'" target="_blank" rel="noopener"><img src="'+u+'" alt="'+nm+'"></a>'):('<a href="'+u+'" target="_blank" rel="noopener">📄 '+nm+' ('+fmtSize(a.size)+')</a>')}).join('')+'</div>'):'';return '<div class="note"><b>'+esc(n.title||'Untitled')+'</b><div class="muted">'+esc(n.category||'General')+'</div><div>'+esc(n.content||'')+'</div>'+attHtml+'</div>'}).join('')}async function load(){try{const r=await fetch('/.netlify/functions/list-notes',{credentials:'include'});if(r.status===401){location.href='/?v=safe-login';return}if(!r.ok)throw new Error('Không tải được ghi chú: '+r.status);notes=await r.json();if(!Array.isArray(notes))notes=[];render()}catch(e){$('notes').innerHTML='<div class="msg">'+esc(e.message)+'</div>'}}$('attachment').onchange=()=>{pendingFiles=Array.from($('attachment').files||[]);const preview=$('attachmentPreview');preview.innerHTML='';for(const f of pendingFiles){if(f.size>MAX_FILE){const tag=document.createElement('div');tag.className='msg';tag.textContent='⚠ '+f.name+' vượt '+fmtSize(MAX_FILE);preview.appendChild(tag);continue}if(f.type.startsWith('image/')){const reader=new FileReader();reader.onload=e=>{const img=document.createElement('img');img.src=e.target.result;img.style='max-width:80px;max-height:80px;border-radius:6px;border:1px solid #3a4d74;object-fit:cover';preview.appendChild(img);};reader.readAsDataURL(f);}else{const tag=document.createElement('div');tag.className='muted';tag.style='font-size:12px;padding:4px 8px;background:#18253d;border-radius:6px';tag.textContent='📄 '+f.name+' ('+fmtSize(f.size)+')';preview.appendChild(tag);}}};function fileToBase64(f){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=e=>resolve(String(e.target.result).split(',')[1]||'');reader.onerror=e=>reject(e);reader.readAsDataURL(f);})}async function uploadOne(file,noteId){if(file.size>MAX_FILE)throw new Error('File "'+file.name+'" vượt giới hạn '+fmtSize(MAX_FILE));const data=await fileToBase64(file);const r=await fetch('/.netlify/functions/upload-attachment',{method:'POST',credentials:'include',headers:{'content-type':'application/json'},body:JSON.stringify({name:file.name,mime:file.type||'application/octet-stream',data,noteId})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.error||('Upload lỗi: '+r.status));return d.attachment}async function save(){const content=$('content').value.trim();const files=pendingFiles;if(!content&&files.length===0){$('noteMsg').textContent='Nhập nội dung ghi chú hoặc chọn file đính kèm.';return}const noteId='n'+Date.now();const n={id:noteId,category:$('category').value.trim()||'General',title:$('title').value.trim()||'Untitled',content:content,tags:$('tags').value.split(',').map(s=>s.trim()).filter(Boolean),attachments:[],updated_at:new Date().toISOString()};$('noteMsg').className='msg';$('noteMsg').textContent=files.length?'Đang tải file lên…':'Đang lưu…';try{for(const f of files){const att=await uploadOne(f,noteId);n.attachments.push(att);}const next=[...notes,n];const r=await fetch('/.netlify/functions/set-notes',{method:'POST',credentials:'include',headers:{'content-type':'application/json'},body:JSON.stringify({confirm:'ALLOW_SET_NOTES',notes:next})});if(!r.ok){const d=await r.json().catch(()=>({}));throw new Error(d.error||('Lưu lỗi: '+r.status))}notes=next;$('noteMsg').className='msg ok';$('noteMsg').textContent='Đã lưu thành công!'+(n.attachments.length?(' ('+n.attachments.length+' tệp)'):'');render();$('attachment').value='';$('attachmentPreview').innerHTML='';pendingFiles=[];}catch(e){$('noteMsg').className='msg';$('noteMsg').textContent='Lỗi: '+e.message}}async function ask(){const q=$('question').value.trim();if(!q)return;$('brainMsg').textContent='Đang hỏi…';$('answer').textContent='Đang xử lý…';try{const r=await fetch('/.netlify/functions/brain-query',{method:'POST',credentials:'include',headers:{'content-type':'application/json'},body:JSON.stringify({question:q,history:[],memory:[]})});const raw=await r.text();let d;try{d=JSON.parse(raw)}catch{d={error:raw}}if(!r.ok)throw new Error(d.error||d.detail||raw||('HTTP '+r.status));$('answer').className='answer';$('answer').textContent=d.answer||'(không có nội dung)';$('brainMsg').className='msg ok';$('brainMsg').textContent='Xong.'}catch(e){$('brainMsg').className='msg';$('brainMsg').textContent=e.message;$('answer').textContent=''}}$('reload').onclick=load;$('save').onclick=save;$('ask').onclick=ask;$('clearForm').onclick=()=>{['category','title','content','tags'].forEach(id=>$(id).value='');$('attachment').value='';$('attachmentPreview').innerHTML='';pendingFiles=[];};load();</script></body></html>
